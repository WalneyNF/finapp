<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinApp Pro - Controle Financeiro Inteligente</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  :root {
    --primary: #820ad1;
    --primary-dark: #5a0a91;
    --primary-light: #a938e8;
    --primary-soft: rgba(130,10,209,0.1);
    --bg: #0a0a0f;
    --bg-soft: #12121a;
    --card: #16161f;
    --card-hover: #1e1e28;
    --card-light: #252530;
    --text: #ffffff;
    --text-soft: #c0c0cc;
    --text-muted: #7a7a8a;
    --success: #00d084;
    --success-soft: rgba(0,208,132,0.1);
    --danger: #ff4757;
    --danger-soft: rgba(255,71,87,0.1);
    --warning: #ffa502;
    --warning-soft: rgba(255,165,2,0.1);
    --info: #3b82f6;
    --info-soft: rgba(59,130,246,0.1);
    --border: #2a2a35;
    --border-soft: #1f1f28;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.6);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-lg: 24px;
  }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image: 
      radial-gradient(circle at 10% 0%, rgba(130,10,209,0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(0,208,132,0.05) 0%, transparent 40%);
  }
  .hidden { display: none !important; }

  /* ============ LOGIN ============ */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: 
      radial-gradient(circle at 20% 50%, rgba(130,10,209,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(0,208,132,0.1) 0%, transparent 50%),
      var(--bg);
  }
  .login-container {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(145deg, var(--card), var(--bg-soft));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px 30px;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(20px);
  }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo-icon {
    width: 76px; height: 76px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin-bottom: 14px;
    box-shadow: 0 12px 32px rgba(130,10,209,0.4);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 12px 32px rgba(130,10,209,0.4); }
    50% { box-shadow: 0 12px 40px rgba(130,10,209,0.6); }
  }
  .logo h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .logo p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
  .user-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .user-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--card-light);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s;
    border: 2px solid transparent;
  }
  .user-item:hover { border-color: var(--primary); transform: translateX(4px); background: var(--card-hover); }
  .user-avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
    color: white;
  }
  .user-info h3 { font-size: 15px; margin-bottom: 2px; }
  .user-info p { font-size: 12px; color: var(--text-muted); }
  .add-user-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 2px dashed var(--border);
    border-radius: 14px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .add-user-btn:hover { border-color: var(--primary); color: var(--primary-light); background: var(--primary-soft); }

  /* ============ APP LAYOUT ============ */
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .top-bar {
    background: rgba(22,22,31,0.8);
    backdrop-filter: blur(20px);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .user-badge { display: flex; align-items: center; gap: 12px; }
  .user-badge .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
  }
  .user-badge .name { font-weight: 600; font-size: 15px; }
  .user-badge .role { font-size: 12px; color: var(--text-muted); }
  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--card-light);
    border: 1px solid var(--border-soft);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-2px); }
  .icon-btn.danger:hover { background: var(--danger); border-color: var(--danger); }

  .app-body { display: flex; flex: 1; }
  
  /* Sidebar */
  .sidebar {
    width: 240px;
    background: var(--bg-soft);
    border-right: 1px solid var(--border-soft);
    padding: 16px 12px;
    position: sticky;
    top: 69px;
    height: calc(100vh - 69px);
    overflow-y: auto;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .sidebar-item:hover { background: var(--card); color: var(--text); }
  .sidebar-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(130,10,209,0.3); }
  .sidebar-item .icon { font-size: 18px; width: 24px; text-align: center; }
  .sidebar-section { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; padding: 16px 14px 8px; font-weight: 600; }

  /* Main */
  .main-content { flex: 1; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

  /* ============ COMPONENTS ============ */
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px;
    transition: all 0.25s;
  }
  .card:hover { border-color: var(--border); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* Stats */
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.25s;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: var(--border); box-shadow: var(--shadow); }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--primary);
  }
  .stat-card.income::before { background: var(--success); }
  .stat-card.expense::before { background: var(--danger); }
  .stat-card.savings::before { background: var(--warning); }
  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .stat-change { font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .stat-change.up { color: var(--success); }
  .stat-change.down { color: var(--danger); }

  /* Balance Hero */
  .balance-hero {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: var(--radius-lg);
    padding: 32px;
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .balance-hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }
  .balance-hero::after {
    content: '';
    position: absolute;
    bottom: -30%; left: -10%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(169,56,232,0.3) 0%, transparent 70%);
    border-radius: 50%;
  }
  .balance-hero > * { position: relative; z-index: 1; }
  .balance-hero .label { font-size: 13px; opacity: 0.85; margin-bottom: 8px; font-weight: 500; }
  .balance-hero .value { font-size: 48px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; }
  .balance-hero .sub { font-size: 13px; opacity: 0.8; }

  /* Quick Actions */
  .quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  @media (max-width: 700px) { .quick-actions { grid-template-columns: repeat(2, 1fr); } }
  .quick-btn {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 18px 12px;
    cursor: pointer;
    transition: all 0.25s;
    color: var(--text);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .quick-btn:hover { background: var(--card-hover); border-color: var(--primary); transform: translateY(-2px); }
  .quick-btn .icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: var(--primary-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .quick-btn .label { font-size: 12px; font-weight: 600; }

  /* Section */
  .section {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
  }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .section-title { font-size: 17px; font-weight: 700; }
  .section-link {
    color: var(--primary-light);
    font-size: 13px;
    cursor: pointer;
    background: none;
    border: none;
    font-weight: 500;
  }
  .section-link:hover { text-decoration: underline; }

  /* Buttons */
  .btn {
    padding: 11px 18px;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(130,10,209,0.4); }
  .btn-secondary { background: var(--card-light); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: #e03e4d; }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #00b873; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-ghost { background: transparent; color: var(--text-soft); }
  .btn-ghost:hover { background: var(--card-light); color: var(--text); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }

  /* Forms */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 11px 13px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); background: var(--card); }
  .form-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.3s;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .modal-title { font-size: 20px; font-weight: 700; }
  .modal-close {
    background: var(--card-light);
    border: none;
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
  }
  .modal-close:hover { background: var(--danger); }

  /* Credit Card */
  .credit-card {
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    color: white;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.3s;
    cursor: pointer;
  }
  .credit-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .credit-card.nubank { background: linear-gradient(135deg, #820ad1, #5a0a91); }
  .credit-card.visa { background: linear-gradient(135deg, #1a1f71, #4a55c4); }
  .credit-card.mastercard { background: linear-gradient(135deg, #ff5f6d, #ffc371); }
  .credit-card.platinum { background: linear-gradient(135deg, #434343, #1a1a1a); }
  .credit-card.amex { background: linear-gradient(135deg, #006fcf, #004a99); }
  .credit-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .cc-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
  .cc-name { font-weight: 700; font-size: 16px; }
  .cc-number { font-size: 12px; opacity: 0.85; margin-top: 2px; font-family: monospace; letter-spacing: 1px; }
  .cc-brand { font-size: 20px; font-weight: 800; opacity: 0.9; }
  .cc-bottom { position: relative; z-index: 1; }
  .cc-limit { font-size: 11px; opacity: 0.8; margin-bottom: 4px; }
  .cc-limit-value { font-size: 20px; font-weight: 700; }
  .cc-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .cc-bar-fill { height: 100%; background: rgba(255,255,255,0.9); border-radius: 2px; transition: width 0.5s; }

  /* Caixinha */
  .caixinha-card {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 10px;
    transition: all 0.25s;
  }
  .caixinha-card:hover { border-color: var(--border); transform: translateX(2px); }
  .cx-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cx-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .cx-percent { font-size: 12px; color: var(--primary-light); font-weight: 700; background: var(--primary-soft); padding: 3px 8px; border-radius: 8px; }
  .cx-percent.complete { background: var(--success-soft); color: var(--success); }
  .cx-bar { height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
  .cx-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    border-radius: 4px;
    transition: width 0.5s;
  }
  .cx-bar-fill.complete { background: linear-gradient(90deg, var(--success), #00e89d); }
  .cx-values { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
  .cx-current { color: var(--success); font-weight: 700; font-size: 14px; }
  .cx-actions { display: flex; gap: 6px; margin-top: 10px; }

  /* Transaction */
  .transaction {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-soft);
    transition: all 0.2s;
  }
  .transaction:last-child { border-bottom: none; }
  .transaction:hover { background: var(--bg-soft); margin: 0 -10px; padding: 12px 10px; border-radius: 10px; }
  .tx-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--card-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-weight: 500; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: 12px; color: var(--text-muted); }
  .tx-value { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .tx-value.positive { color: var(--success); }
  .tx-value.negative { color: var(--danger); }

  /* Conta (bills) */
  .conta {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.25s;
    border-left: 4px solid var(--border);
  }
  .conta:hover { border-color: var(--border); }
  .conta.pending { border-left-color: var(--warning); }
  .conta.paid { border-left-color: var(--success); opacity: 0.7; }
  .conta.overdue { border-left-color: var(--danger); }
  .conta.receivable { border-left-color: var(--info); }
  .conta-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--card-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .conta-info { flex: 1; min-width: 0; }
  .conta-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .conta-meta { font-size: 12px; color: var(--text-muted); }
  .conta-value { font-weight: 700; font-size: 15px; }
  .conta-status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .status-pending { background: var(--warning-soft); color: var(--warning); }
  .status-paid { background: var(--success-soft); color: var(--success); }
  .status-overdue { background: var(--danger-soft); color: var(--danger); }

  /* Empty */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty h3 { font-size: 16px; margin-bottom: 6px; color: var(--text-soft); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 14px 22px;
    border-radius: 12px;
    z-index: 200;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.3s;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Filter */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-chip {
    padding: 7px 14px;
    background: var(--card-light);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s;
    font-weight: 500;
  }
  .filter-chip:hover { color: var(--text); border-color: var(--border); }
  .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--bg-soft);
    padding: 5px;
    border-radius: 14px;
    margin-bottom: 20px;
    overflow-x: auto;
    border: 1px solid var(--border-soft);
  }
  .tab {
    flex: 1;
    min-width: 100px;
    padding: 11px 16px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(130,10,209,0.3); }
  .tab:hover:not(.active) { color: var(--text); background: var(--card); }

  /* Tip Card */
  .tip-card {
    background: linear-gradient(135deg, var(--card), var(--card-light));
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .tip-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: var(--primary);
  }
  .tip-card:hover { transform: translateX(3px); border-color: var(--border); }
  .tip-card.investment::before { background: var(--success); }
  .tip-card.education::before { background: var(--info); }
  .tip-card.warning::before { background: var(--warning); }
  .tip-tag {
    display: inline-block;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .tip-tag.investment { background: var(--success-soft); color: var(--success); }
  .tip-tag.education { background: var(--info-soft); color: var(--info); }
  .tip-tag.warning { background: var(--warning-soft); color: var(--warning); }
  .tip-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .tip-desc { font-size: 13px; color: var(--text-soft); line-height: 1.5; }

  /* Budget */
  .budget-item {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
  }
  .budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .budget-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .budget-values { font-size: 12px; color: var(--text-muted); }
  .budget-bar { height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; }
  .budget-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .budget-fill.ok { background: linear-gradient(90deg, var(--success), #00e89d); }
  .budget-fill.warn { background: linear-gradient(90deg, var(--warning), #ffb84d); }
  .budget-fill.danger { background: linear-gradient(90deg, var(--danger), #ff7a85); }

  /* Goal */
  .goal-card {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    transition: all 0.25s;
  }
  .goal-card:hover { border-color: var(--border); transform: translateY(-2px); }
  .goal-icon { font-size: 36px; margin-bottom: 10px; }
  .goal-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .goal-values { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .goal-progress { font-size: 24px; font-weight: 800; color: var(--primary-light); }

  /* Score */
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--primary) 0deg, var(--primary) 0deg, var(--border) 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    position: relative;
  }
  .score-circle::before {
    content: '';
    position: absolute;
    inset: 8px;
    background: var(--card);
    border-radius: 50%;
  }
  .score-value { position: relative; z-index: 1; font-size: 32px; font-weight: 800; }

  /* Menu Panel */
  .menu-panel {
    position: fixed;
    top: 0; right: -380px;
    width: 340px;
    height: 100vh;
    background: var(--card);
    z-index: 50;
    transition: right 0.3s;
    padding: 24px;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
  }
  .menu-panel.open { right: 0; }

  /* Chart container */
  .chart-container { position: relative; height: 280px; }
  .chart-container-sm { position: relative; height: 200px; }

  /* Scroll */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

  /* Print */
  @media print {
    body { background: white; color: black; }
    .top-bar, .sidebar, .quick-actions, .icon-btn, .menu-panel, .modal-overlay, .toast, .btn { display: none !important; }
    .section, .stat-card, .card, .credit-card, .caixinha-card, .conta, .tip-card { background: white; color: black; border: 1px solid #ddd; }
    .balance-hero { background: #f0f0f0 !important; color: black; }
    .main-content { max-width: 100%; padding: 10px; }
  }

  /* Mobile bottom nav */
  .bottom-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 8px;
    z-index: 20;
    justify-content: space-around;
  }
  .bottom-nav-item {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 8px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .bottom-nav-item.active { color: var(--primary-light); }
  .bottom-nav-item .icon { font-size: 20px; }
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .bottom-nav { display: flex; }
    .main-content { padding: 16px; padding-bottom: 80px; }
  }

  /* Alerts */
  .alert {
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .alert-warning { background: var(--warning-soft); border: 1px solid rgba(255,165,2,0.3); color: var(--warning); }
  .alert-danger { background: var(--danger-soft); border: 1px solid rgba(255,71,87,0.3); color: var(--danger); }
  .alert-info { background: var(--info-soft); border: 1px solid rgba(59,130,246,0.3); color: var(--info); }
  .alert-success { background: var(--success-soft); border: 1px solid rgba(0,208,132,0.3); color: var(--success); }
  .alert-icon { font-size: 20px; }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-primary { background: var(--primary-soft); color: var(--primary-light); }
  .badge-success { background: var(--success-soft); color: var(--success); }
  .badge-danger { background: var(--danger-soft); color: var(--danger); }
  .badge-warning { background: var(--warning-soft); color: var(--warning); }
</style>
</head>

// ============ INIT ============
function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { data = JSON.parse(saved); } catch(e) { data = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  } else {
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  saveData();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadSession() {
  const s = localStorage.getItem(SESSION_KEY);
  if (s) {
    currentUser = data.users.find(u => u.id === s);
    if (currentUser) showApp();
  }
}

function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  renderUserList();
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topAvatar').textContent = currentUser.name[0].toUpperCase();
  document.getElementById('topAvatar').style.background = `linear-gradient(135deg, ${currentUser.color}, ${currentUser.color}dd)`;
  document.getElementById('topName').textContent = currentUser.name;

}

// ============ HELPERS ============
function formatMoney(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getUserData() {
  return {
    transactions: data.transactions.filter(t => t.userId === currentUser.id),
    cards: data.cards.filter(c => c.userId === currentUser.id),
    caixinhas: data.caixinhas.filter(c => c.userId === currentUser.id),
    contas: data.contas.filter(c => c.userId === currentUser.id),
    budgets: data.budgets.filter(b => b.userId === currentUser.id),
    goals: data.goals.filter(g => g.userId === currentUser.id)
  };
}

function getMonthTransactions() {
  const now = new Date();
  const month = now.toISOString().slice(0, 7);
  return getUserData().transactions.filter(t => t.date.startsWith(month));
}

function getScore() {
  const ud = getUserData();
  const monthTx = getMonthTransactions();
  const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.value, 0);
  const expense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + Math.abs(t.value), 0);
  const savingsRate = income > 0 ? ((income - expense) / income) * 100 : 0;
  
  let score = 50;
  if (savingsRate > 20) score += 20;
  else if (savingsRate > 10) score += 10;
  if (ud.contas.filter(c => c.status === 'overdue').length === 0) score += 15;
  if (ud.caixinhas.length > 0) score += 10;
  if (ud.goals.length > 0) score += 5;
  return Math.min(100, Math.max(0, Math.round(score)));
}

function renderDashboardCharts() {
  const ud = getUserData();
  const monthTx = getMonthTransactions();
  
  // Flow chart
  const flowCtx = document.getElementById('dashFlowChart');
  if (flowCtx) {
    const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.value, 0);
    const expense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + Math.abs(t.value), 0);
    charts.dashFlow = new Chart(flowCtx, {
      type: 'doughnut',
      data: {
        labels: ['Entradas', 'Saídas', 'Economia'],
        datasets: [{
          data: [income, expense, Math.max(0, income - expense)],
          backgroundColor: ['#00d084', '#ff4757', '#ffa502'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: '#c0c0cc', font: { size: 11 } } } }
      }
    });
  }

  // Category chart
  const catCtx = document.getElementById('dashCatChart');
  if (catCtx) {
    const byCat = {};
    monthTx.filter(t => t.type === 'expense').forEach(t => {
      byCat[t.category] = (byCat[t.category] || 0) + Math.abs(t.value);
    });
    const entries = Object.entries(byCat).sort((a,b) => b[1] - a[1]).slice(0, 6);
    charts.dashCat = new Chart(catCtx, {
      type: 'bar',
      data: {
        labels: entries.map(([id]) => {
          const c = data.categories.find(x => x.id === id);
          return c ? c.icon + ' ' + c.name : 'Outros';
        }),
        datasets: [{
          data: entries.map(([,v]) => v),
          backgroundColor: entries.map(([id]) => {
            const c = data.categories.find(x => x.id === id);
            return c ? c.color : '#888';
          }),
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#7a7a8a', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#7a7a8a' }, grid: { color: '#2a2a35' } }

  const totalPayable = payable.filter(c => c.status !== 'paid').reduce((s,c) => s + c.value, 0);

      ${payable.length ? payable.map(c => renderContaItem(c)).join('') : '<div class="empty"><div class="icon">📤</div>Nenhuma conta a pagar</div>'}
    </div>

      <div class="section-header">
        <div class="section-title">📥 Contas a Receber</div>
        <button class="btn btn-primary" onclick="openContaModal('receivable')">+ Nova</button>

      ${receivable.length ? receivable.map(c => renderContaItem(c)).join('') : '<div class="empty"><div class="icon">📥</div>Nenhuma conta a receber</div>'}
    </div>
  `;
}

function renderContaItem(c) {
  const due = new Date(c.dueDate);
  const now = new Date();
  const daysLeft = Math.ceil((due - now) / 86400000);
  const cat = data.categories.find(x => x.id === c.category);
  let statusClass = 'pending';
  let statusText = 'Pendente';
  if (c.status === 'paid') { statusClass = 'paid'; statusText = 'Paga'; }
  else if (c.status === 'overdue' || daysLeft < 0) { statusClass = 'overdue'; statusText = 'Atrasada'; }
  else if (daysLeft <= 3) { statusText = `Vence em ${daysLeft}d`; }
  else { statusText = `Vence em ${daysLeft}d`; }

  return `
    <div class="conta ${statusClass} ${c.type}">
      <div class="conta-icon">${c.icon || '📄'}</div>
      <div class="conta-info">
        <div class="conta-name">${c.name} ${c.recurring ? '<span class="badge badge-primary">Recorrente</span>' : ''}</div>
        <div class="conta-meta">${cat ? cat.name : ''} • ${new Date(c.dueDate).toLocaleDateString('pt-BR')}</div>
      </div>
      <div class="conta-value" style="color:${c.type === 'receivable' ? 'var(--success)' : 'var(--text)'}">${formatMoney(c.value)}</div>
      <span class="conta-status status-${statusClass}">${statusText}</span>
      <div style="display:flex;gap:4px">
        ${c.status !== 'paid' ? `<button class="btn btn-sm btn-success" onclick="markContaPaid('${c.id}')">✓</button>` : ''}
        <button class="btn btn-sm btn-ghost" onclick="openContaModal(null, '${c.id}')">✏️</button>
        <button class="btn btn-sm btn-ghost" onclick="deleteConta('${c.id}')" style="color:var(--danger)">🗑️</button>
      </div>
    </div>
  `;
}

function simulateInvestment() {
  const initial = parseFloat(document.getElementById('simInitial').value) || 0;
  const monthly = parseFloat(document.getElementById('simMonthly').value) || 0;
  const rate = parseFloat(document.getElementById('simRate').value) || 0;
  const years = parseInt(document.getElementById('simYears').value) || 0;
  const monthlyRate = Math.pow(1 + rate/100, 1/12) - 1;
  const months = years * 12;
  let total = initial;
  for (let i = 0; i < months; i++) {
    total = total * (1 + monthlyRate) + monthly;
  }
  const invested = initial + monthly * months;
  const profit = total - invested;
  document.getElementById('simResult').innerHTML = `
    <div class="grid grid-3" style="margin-top:16px">
      <div class="stat-card">
        <div class="stat-label">Total investido</div>
        <div class="stat-value" style="font-size:20px">${formatMoney(invested)}</div>
      </div>
      <div class="stat-card income">
        <div class="stat-label">Rendimentos</div>
        <div class="stat-value" style="font-size:20px;color:var(--success)">${formatMoney(profit)}</div>
      </div>
      <div class="stat-card savings">
        <div class="stat-label">Valor final</div>
        <div class="stat-value" style="font-size:20px;color:var(--primary-light)">${formatMoney(total)}</div>
      </div>
    </div>
  `;
}

function renderReportCharts() {
  const ud = getUserData();
  
  // Flow chart (6 months)
  const flowCtx = document.getElementById('reportFlowChart');
  if (flowCtx) {
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push(d.toISOString().slice(0, 7));
    }
    const incomeData = months.map(m => ud.transactions.filter(t => t.date.startsWith(m) && t.type === 'income').reduce((s,t) => s + t.value, 0));
    const expenseData = months.map(m => ud.transactions.filter(t => t.date.startsWith(m) && t.type === 'expense').reduce((s,t) => s + Math.abs(t.value), 0));
    charts.reportFlow = new Chart(flowCtx, {
      type: 'bar',
      data: {
        labels: months.map(m => m.split('-')[1] + '/' + m.split('-')[0].slice(2)),
        datasets: [
          { label: 'Entradas', data: incomeData, backgroundColor: '#00d084', borderRadius: 6 },
          { label: 'Saídas', data: expenseData, backgroundColor: '#ff4757', borderRadius: 6 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#c0c0cc' } } },
        scales: {
          x: { ticks: { color: '#7a7a8a' }, grid: { display: false } },
          y: { ticks: { color: '#7a7a8a', callback: v => 'R$' + v }, grid: { color: '#2a2a35' } }
        }
      }
    });
  }

  // Category chart
  const catCtx = document.getElementById('reportCatChart');
  if (catCtx) {
    const byCat = {};
    ud.transactions.filter(t => t.type === 'expense').forEach(t => {
      byCat[t.category] = (byCat[t.category] || 0) + Math.abs(t.value);
    });
    const entries = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
    charts.reportCat = new Chart(catCtx, {
      type: 'doughnut',
      data: {
        labels: entries.map(([id]) => {
          const c = data.categories.find(x => x.id === id);
          return c ? c.name : 'Outros';
        }),
        datasets: [{
          data: entries.map(([,v]) => v),
          backgroundColor: entries.map(([id]) => {
            const c = data.categories.find(x => x.id === id);
            return c ? c.color : '#888';
          }),
          borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { color: '#c0c0cc', font: { size: 11 } } } }
      }
    });
  }

  // Card chart
  const cardCtx = document.getElementById('reportCardChart');
  if (cardCtx) {
    const byCard = {};
    ud.transactions.filter(t => t.card && t.type === 'expense').forEach(t => {
      byCard[t.card] = (byCard[t.card] || 0) + Math.abs(t.value);
    });
    const entries = Object.entries(byCard);
    charts.reportCard = new Chart(cardCtx, {
      type: 'pie',
      data: {
        labels: entries.map(([id]) => {
          const c = data.cards.find(x => x.id === id);
          return c ? c.name : 'Outros';
        }),
        datasets: [{
          data: entries.map(([,v]) => v),
          backgroundColor: ['#820ad1', '#1a1f71', '#ff5f6d', '#434343', '#006fcf'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { color: '#c0c0cc' } } }
      }
    });
  }

  // Wealth evolution
  const wealthCtx = document.getElementById('reportWealthChart');
  if (wealthCtx) {
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push(d.toISOString().slice(0, 7));
    }
    let cumulative = 0;
    const wealthData = months.map(m => {
      const monthTx = ud.transactions.filter(t => t.date.startsWith(m));
      cumulative += monthTx.reduce((s,t) => s + t.value, 0);
      return cumulative;
    });
    charts.reportWealth = new Chart(wealthCtx, {
      type: 'line',
      data: {
        labels: months.map(m => m.split('-')[1] + '/' + m.split('-')[0].slice(2)),
        datasets: [{
          label: 'Patrimônio',
          data: wealthData,
          borderColor: '#820ad1',
          backgroundColor: 'rgba(130,10,209,0.1)',
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#820ad1'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#c0c0cc' } } },
        scales: {
          x: { ticks: { color: '#7a7a8a' }, grid: { display: false } },
          y: { ticks: { color: '#7a7a8a', callback: v => 'R$' + v }, grid: { color: '#2a2a35' } }
        }
      }
    });
  }
}

// ============ MODALS ============
function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}

function openAddUser() {
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Novo Usuário</div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="newUserName" placeholder="Ex: João"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="newUserEmail" placeholder="email@exemplo.com"></div>
    <div class="form-group"><label class="form-label">Perfil</label><select class="form-select" id="newUserRole"><option>Titular</option><option>Dependente</option><option>Convidado</option></select></div>
    <div class="form-group"><label class="form-label">Cor</label><input type="color" class="form-input" id="newUserColor" value="#820ad1"></div>
    <button class="btn btn-primary btn-block" onclick="saveNewUser()">Criar usuário</button>
  `);
}

function saveNewUser() {
  const name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const role = document.getElementById('newUserRole').value;
  const color = document.getElementById('newUserColor').value;
  if (!name) return toast('Informe o nome');
  data.users.push({ id: 'u' + Date.now(), name, email, role, color });
  saveData();
  document.querySelector('.modal-overlay').remove();
  renderPage();
  toast('Usuário criado!');

function deleteUser(id) {
  if (!confirm('Excluir usuário e todos seus dados?')) return;
  data.users = data.users.filter(u => u.id !== id);
  data.transactions = data.transactions.filter(t => t.userId !== id);
  data.cards = data.cards.filter(c => c.userId !== id);
  data.caixinhas = data.caixinhas.filter(c => c.userId !== id);
  data.contas = data.contas.filter(c => c.userId !== id);
  data.budgets = data.budgets.filter(b => b.userId !== id);
  data.goals = data.goals.filter(g => g.userId !== id);
  saveData();
  renderPage();
  toast('Usuário excluído');
}

function saveTransaction(id) {
  const name = document.getElementById('txName').value.trim();
  const value = parseFloat(document.getElementById('txValue').value);
  const type = document.getElementById('txType').value;
  const category = document.getElementById('txCategory').value;
  const date = document.getElementById('txDate').value;
  const card = document.getElementById('txCard').value;
  if (!name || isNaN(value)) return toast('Preencha descrição e valor');
  const finalValue = type === 'expense' ? -Math.abs(value) : Math.abs(value);
  if (id) {
    const tx = data.transactions.find(t => t.id === id);
    Object.assign(tx, { name, value: finalValue, type, category, date, card });
  } else {
    data.transactions.push({ id: 't' + Date.now(), userId: currentUser.id, name, value: finalValue, type, category, date, card });
  }
  saveData();
  document.querySelector('.modal-overlay').remove();
  renderPage();
  toast('Transação salva!');
}

function deleteTransaction(id) {
  if (!confirm('Excluir transação?')) return;
  data.transactions = data.transactions.filter(t => t.id !== id);
  saveData();
  document.querySelector('.modal-overlay').remove();
  renderPage();
  toast('Excluída!');
}

  openModal(`

    </div>
    <div class="form-group"><label class="form-label">Valor do resgate (R$)</label><input class="form-input" id="depValue" type="number" step="0.01" placeholder="0,00"></div>

    <div class="form-group"><label class="form-label">Data</label><input class="form-input" id="depDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>

  `);

function saveCaixinhaTransaction(id, type) {
  const value = parseFloat(document.getElementById('depValue').value);
  const desc = document.getElementById('depDesc').value.trim();
  const date = document.getElementById('depDate').value;
  if (!value || value <= 0) return toast('Informe um valor válido');
  const cx = data.caixinhas.find(c => c.id === id);
  if (type === 'withdraw' && value > cx.current) return toast('Saldo insuficiente');
  if (!cx.transactions) cx.transactions = [];
  cx.transactions.push({ id: 'd' + Date.now(), type, value, date, desc });
  cx.current = type === 'deposit' ? cx.current + value : cx.current - value;
  saveData();
  document.querySelector('.modal-overlay').remove();
  renderPage();
  toast(type === 'deposit' ? 'Depósito realizado!' : 'Resgate realizado!');
}

  const actualType = type || (conta?.type) || 'payable';
  openModal(`
    <div class="modal-header"><div class="modal-title">${conta ? 'Editar' : 'Nova'} Conta</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="form-group"><label class="form-label">Tipo</label><select class="form-select" id="ctType"><option value="payable" ${actualType === 'payable' ? 'selected' : ''}>A Pagar</option><option value="receivable" ${actualType === 'receivable' ? 'selected' : ''}>A Receber</option></select></div>
    <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="ctName" value="${conta ? conta.name : ''}" placeholder="Ex: Aluguel"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Valor (R$)</label><input class="form-input" id="ctValue" type="number" step="0.01" value="${conta ? conta.value : ''}"></div>
      <div class="form-group"><label class="form-label">Vencimento</label><input class="form-input" id="ctDue" type="date" value="${conta ? conta.dueDate : new Date().toISOString().slice(0,10)}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Categoria</label><select class="form-select" id="ctCategory">${data.categories.map(c => `<option value="${c.id}" ${conta && conta.category === c.id ? 'selected' : ''}>${c.icon} ${c.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Ícone</label><input class="form-input" id="ctIcon" value="${conta ? conta.icon : ''}" maxlength="4"></div>
    </div>
    <div class="form-group"><label class="form-label" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="ctRecurring" ${conta?.recurring ? 'checked' : ''}> Conta recorrente (mensal)</label></div>
    <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="ctStatus"><option value="pending" ${conta && conta.status === 'pending' ? 'selected' : ''}>Pendente</option><option value="paid" ${conta && conta.status === 'paid' ? 'selected' : ''}>Paga/Recebida</option><option value="overdue" ${conta && conta.status === 'overdue' ? 'selected' : ''}>Atrasada</option></select></div>
    <div class="btn-row" style="display:flex;gap:10px;margin-top:10px">
      ${conta ? `<button class="btn btn-danger" onclick="deleteConta('${conta.id}')">Excluir</button>` : ''}
      <button class="btn btn-primary btn-block" onclick="saveConta('${id || ''}')">Salvar</button>
    </div>
  `);
}

function saveConta(id) {
  const type = document.getElementById('ctType').value;
  const name = document.getElementById('ctName').value.trim();
  const value = parseFloat(document.getElementById('ctValue').value);
  const dueDate = document.getElementById('ctDue').value;
  const category = document.getElementById('ctCategory').value;
  const icon = document.getElementById('ctIcon').value;
  const recurring = document.getElementById('ctRecurring').checked;
  const status = document.getElementById('ctStatus').value;
  if (!name || isNaN(value)) return toast('Preencha nome e valor');
  if (id) {
    const c = data.contas.find(x => x.id === id);
    Object.assign(c, { type, name, value, dueDate, category, icon, recurring, status });
  } else {
    data.contas.push({ id: 'ct' + Date.now(), userId: currentUser.id, type, name, value, dueDate, category, icon, recurring, status });
  }
  saveData();
  document.querySelector('.modal-overlay').remove();
  renderPage();
  toast('Conta salva!');
}

function deleteConta(id) {
  if (!confirm('Excluir conta?')) return;
  data.contas = data.contas.filter(c => c.id !== id);
  saveData();
  document.querySelector('.modal-overlay').remove();
  renderPage();
  toast('Excluída!');
}

function markContaPaid(id) {
  const c = data.contas.find(x => x.id === id);
  c.status = 'paid';
  // Auto-create transaction
  const cat = c.category;
  const value = c.type === 'payable' ? -c.value : c.value;
  data.transactions.push({
    id: 't' + Date.now(),
    userId: currentUser.id,
    name: c.name,
    category: cat,
    value: value,
    date: new Date().toISOString().slice(0,10),
    type: c.type === 'payable' ? 'expense' : 'income'
  });
  saveData();
  renderPage();
  toast('Conta marcada como paga!');
}

function saveGoal(id) {

  document.querySelector('.modal-overlay').remove();
  renderPage();
  toast('Meta salva!');

function deleteGoal(id) {

function deleteCategory(id) {

function openSearch() {
  openModal(`
    <div class="modal-header"><div class="modal-title">🔍 Buscar</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="form-group"><input class="form-input" id="searchInput" placeholder="Digite para buscar..." oninput="doSearch()"></div>
    <div id="searchResults"></div>
  `);
}

function doSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
  const ud = getUserData();
  const tx = ud.transactions.filter(t => t.name.toLowerCase().includes(q));
  const ct = ud.contas.filter(c => c.name.toLowerCase().includes(q));
  let html = '';
  if (tx.length) {
    html += '<div style="font-size:12px;color:var(--text-muted);margin:12px 0 8px;font-weight:600">TRANSAÇÕES</div>';
    html += tx.map(t => renderTransactionItem(t)).join('');
  }
  if (ct.length) {
    html += '<div style="font-size:12px;color:var(--text-muted);margin:12px 0 8px;font-weight:600">CONTAS</div>';
    html += ct.map(c => renderContaItem(c)).join('');
  }
  document.getElementById('searchResults').innerHTML = html || '<div class="empty">Nenhum resultado</div>';
}

// ============ MENU ============
function openMenu() { document.getElementById('menuPanel').classList.add('open'); }
function closeMenu() { document.getElementById('menuPanel').classList.remove('open'); }

// ============ EXPORT/IMPORT ============
function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finapp_pro_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON exportado!');
}

function exportCSV() {
  const rows = [['ID', 'Usuário', 'Descrição', 'Categoria', 'Valor', 'Tipo', 'Data', 'Cartão']];
  data.transactions.forEach(t => {
    const u = data.users.find(x => x.id === t.userId);
    const c = data.categories.find(x => x.id === t.category);
    const cd = data.cards.find(x => x.id === t.card);
    rows.push([t.id, u?.name || '', t.name, c?.name || '', t.value, t.type, t.date, cd?.name || '']);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finapp_transacoes_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado!');
}

function exportPDF() {
  toast('Use Ctrl+P para imprimir como PDF');
  setTimeout(() => window.print(), 500);
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (imported.users && imported.transactions) {
        if (confirm('Substituir dados atuais? (Cancelar = mesclar)')) {
          data = imported;
        } else {
          imported.users.forEach(u => { if (!data.users.find(x => x.id === u.id)) data.users.push(u); });
          imported.categories.forEach(c => { if (!data.categories.find(x => x.id === c.id)) data.categories.push(c); });
          imported.cards.forEach(c => { if (!data.cards.find(x => x.id === c.id)) data.cards.push(c); });
          imported.caixinhas.forEach(c => { if (!data.caixinhas.find(x => x.id === c.id)) data.caixinhas.push(c); });
          imported.transactions.forEach(t => { if (!data.transactions.find(x => x.id === t.id)) data.transactions.push(t); });
          if (imported.contas) imported.contas.forEach(c => { if (!data.contas.find(x => x.id === c.id)) data.contas.push(c); });
          if (imported.budgets) imported.budgets.forEach(b => { if (!data.budgets.find(x => x.id === b.id)) data.budgets.push(b); });
          if (imported.goals) imported.goals.forEach(g => { if (!data.goals.find(x => x.id === g.id)) data.goals.push(g); });
        }
        saveData();
        renderPage();
        toast('Dados importados!');
      } else {
        toast('Arquivo inválido');
      }
    } catch(err) { toast('Erro ao importar'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function shareWhatsApp() {
  const ud = getUserData();
  const monthTx = getMonthTransactions();
  const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.value, 0);
  const expense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + Math.abs(t.value), 0);
  const balance = income - expense;
  const pendingContas = ud.contas.filter(c => c.status === 'pending' && c.type === 'payable');
  let msg = ` *FinApp Pro - Resumo ${currentUser.name}*\n\n`;
  msg += `📊 *Saldo do mês:* ${formatMoney(balance)}\n`;
  msg += `📈 Entradas: ${formatMoney(income)}\n`;
  msg += `📉 Saídas: ${formatMoney(expense)}\n`;
  msg += `💰 Economia: ${income > 0 ? ((balance/income)*100).toFixed(0) : 0}%\n\n`;
  msg += `💳 *Cartões:*\n`;
  ud.cards.forEach(c => { msg += `• ${c.name}: ${formatMoney(c.used)} / ${formatMoney(c.limit)}\n`; });
  msg += `\n *Caixinhas:*\n`;
  ud.caixinhas.forEach(c => {
    const pct = (c.current / c.target * 100).toFixed(0);
    msg += `• ${c.icon} ${c.name}: ${pct}% (${formatMoney(c.current)})\n`;
  });
  if (pendingContas.length) {
    msg += `\n📋 *Contas pendentes (${pendingContas.length}):*\n`;
    pendingContas.forEach(c => { msg += `• ${c.name}: ${formatMoney(c.value)} (vence ${new Date(c.dueDate).toLocaleDateString('pt-BR')})\n`; });
  }
  msg += `\n Score: ${getScore()}/100\n`;
  msg += `\n Gerado em ${new Date().toLocaleString('pt-BR')}`;
  const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  toast('Abrindo WhatsApp...');
}

function resetData() {
  if (!confirm('Resetar TODOS os dados? Esta ação não pode ser desfeita.')) return;
  if (!confirm('Tem CERTEZA? Todos os dados serão perdidos.')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
  renderPage();
  toast('Dados resetados!');
}

// ============ TOAST ============
function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>✓</span> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

loadData();
loadSession();
if (!currentUser) showLogin();
